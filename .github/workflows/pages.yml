name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - run: npm install

      - name: Build with verbose logging
        run: |
          npm run build --verbose
        continue-on-error: true

      - name: Show dist folder
        run: |
          echo "=== dist folder ==="
          ls -R dist || echo "dist does not exist"

      - name: Show full workspace
        run: |
          echo "=== workspace ==="
          ls -R .



      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
